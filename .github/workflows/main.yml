name: Build Printer Terbaru APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cari project Android
        run: |
          unzip -q Printer_Terbaru.zip -d project
          find project -name settings.gradle.kts -o -name settings.gradle

      - name: Build APK
        run: |
          PROJECT=$(find project -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs dirname)
          cd "$PROJECT"
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            echo "gradlew tidak ditemukan"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Printer-Terbaru-APK
          path: "project/**/app/build/outputs/apk/debug/*.apk"
