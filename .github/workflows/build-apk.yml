name: Build Gift Printer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q Printer_Terbaru.zip -d project

      - name: Find Android project
        run: |
          echo "Mencari project Android..."
          find project -name settings.gradle.kts -o -name settings.gradle
          find project -path "*/app/build.gradle.kts" -o -path "*/app/build.gradle"

      - name: Build APK
        run: |
          ROOT=$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs dirname)

          echo "Project ditemukan:"
          echo "$ROOT"

          cd "$ROOT"

          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Printer-Terbaru-APK
          path: "project/**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error              kotlinOptions {
                  jvmTarget = "17"
              }
          '''

          if 'jvmTarget = "17"' not in s:
              s = s.replace(marker, marker + addition)

          p.write_text(s)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: project
        run: |
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GiftPrinter-v3-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
